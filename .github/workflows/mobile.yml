name: Mobile builds

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install and build webapp
        run: |
          npm install
          npm run build
      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: seven-spells-android-unsigned
          path: android/app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error
      - name: Sign Android release (when credentials exist)
        if: ${{ env.HAS_ANDROID_KEYS == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out seven-spells-signed.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify seven-spells-signed.apk
      - name: Upload signed APK
        if: ${{ env.HAS_ANDROID_KEYS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: seven-spells-android-signed
          path: seven-spells-signed.apk
          if-no-files-found: error
    env:
      HAS_ANDROID_KEYS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build webapp
        run: |
          npm install
          npm run build
      - name: Generate and sync iOS project
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned iOS app for simulator
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ssod-ios" CODE_SIGNING_ALLOWED=NO build
          cd "$RUNNER_TEMP/ssod-ios/Build/Products/Release-iphonesimulator"
          zip -qr "$GITHUB_WORKSPACE/seven-spells-ios-simulator-unsigned.zip" App.app
      - name: Upload unsigned simulator app
        uses: actions/upload-artifact@v4
        with:
          name: seven-spells-ios-unsigned-simulator
          path: seven-spells-ios-simulator-unsigned.zip
          if-no-files-found: error
      - name: Signing status
        if: ${{ env.HAS_IOS_KEYS != 'true' }}
        run: echo 'Apple distribution credentials absent; unsigned simulator build completed. No IPA is produced.'
    env:
      HAS_IOS_KEYS: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
