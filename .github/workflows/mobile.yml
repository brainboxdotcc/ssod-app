name: Application builds

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  VITE_GAME_WS_URL: ${{ vars.VITE_GAME_WS_URL }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HAS_ANDROID_KEYS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate WebSocket endpoint
        run: |
          if [ -z "$VITE_GAME_WS_URL" ]; then
            echo "::error::Set the VITE_GAME_WS_URL repository variable in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          case "$VITE_GAME_WS_URL" in
            wss://*) ;;
            *) echo "::error::VITE_GAME_WS_URL must begin with wss://"; exit 1 ;;
          esac

      - name: Install and build webapp
        run: |
          npm install
          npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Set Android version code
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          sed -i -E "s/^([[:space:]]*versionCode[[:space:]]+)[0-9]+/\1${BUILD_NUMBER}/" android/app/build.gradle
          grep -E "^[[:space:]]*versionCode[[:space:]]+${BUILD_NUMBER}$" android/app/build.gradle

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Use direct Gradle distribution host and allow retries
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          content = wrapper.read_text()
          content = content.replace('-all.zip', '-bin.zip')
          content = content.replace('services.gradle.org/distributions/', 'downloads.gradle.org/distributions/')
          lines = [line for line in content.splitlines() if not line.startswith(('networkTimeout=', 'retries=', 'retryBackOffMs='))]
          lines.extend(['networkTimeout=60000', 'retries=2', 'retryBackOffMs=1000'])
          wrapper.write_text('\n'.join(lines) + '\n')
          PYCODE

      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate debug keystore if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK, release APK and Android App Bundle
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: seven-spells-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Android test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload android-test \
            android/app/build/outputs/apk/debug/app-debug.apk#seven-spells-android.apk \
            --clobber

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: seven-spells-android-unsigned
          path: android/app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error

      - name: Upload unsigned AAB (not for Play submission)
        if: ${{ env.HAS_ANDROID_KEYS != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: seven-spells-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Sign Android release APK and AAB
        if: ${{ env.HAS_ANDROID_KEYS == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          "$BUILD_TOOLS/zipalign" -p -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out seven-spells-signed.apk "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify seven-spells-signed.apk

          jarsigner \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar seven-spells-android.aab \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"

          jarsigner -verify seven-spells-android.aab

      - name: Upload signed APK
        if: ${{ env.HAS_ANDROID_KEYS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: seven-spells-android-signed
          path: seven-spells-signed.apk
          if-no-files-found: error

      - name: Install 7-Zip
        if: ${{ env.HAS_ANDROID_KEYS == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Encrypt signed Android AAB
        if: ${{ env.HAS_ANDROID_KEYS == 'true' }}
        env:
          ARCHIVE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          7z a \
            -t7z \
            -m0=lzma2 \
            -mhe=on \
            -p"$ARCHIVE_PASSWORD" \
            seven-spells-android.7z \
            seven-spells-android.aab

          test -s seven-spells-android.7z

          7z t \
            -p"$ARCHIVE_PASSWORD" \
            seven-spells-android.7z

          rm -f seven-spells-android.aab

      - name: Upload encrypted signed Android AAB
        if: ${{ env.HAS_ANDROID_KEYS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: seven-spells-android-aab-encrypted
          path: seven-spells-android.7z
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_IOS_KEYS: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate WebSocket endpoint
        run: |
          if [ -z "$VITE_GAME_WS_URL" ]; then
            echo "::error::Set the VITE_GAME_WS_URL repository variable in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          case "$VITE_GAME_WS_URL" in
            wss://*) ;;
            *) echo "::error::VITE_GAME_WS_URL must begin with wss://"; exit 1 ;;
          esac

      - name: Install and build webapp
        run: |
          npm install
          npm run build

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Build unsigned iOS app for simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ssod-ios" CODE_SIGNING_ALLOWED=NO build
          cd "$RUNNER_TEMP/ssod-ios/Build/Products/Release-iphonesimulator"
          zip -qr "$GITHUB_WORKSPACE/seven-spells-ios-simulator-unsigned.zip" App.app

      - name: Upload unsigned simulator app
        uses: actions/upload-artifact@v4
        with:
          name: seven-spells-ios-unsigned-simulator
          path: seven-spells-ios-simulator-unsigned.zip
          if-no-files-found: error

      - name: Signing status
        if: ${{ env.HAS_IOS_KEYS != 'true' }}
        run: echo 'Apple distribution credentials absent; unsigned simulator build completed. No IPA is produced.'



  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate WebSocket endpoint
        shell: bash
        run: |
          if [ -z "$VITE_GAME_WS_URL" ]; then
            echo "::error::Set the VITE_GAME_WS_URL repository variable in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          case "$VITE_GAME_WS_URL" in
            wss://*) ;;
            *) echo "::error::VITE_GAME_WS_URL must begin with wss://"; exit 1 ;;
          esac

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows executable
        run: npx tauri build --no-bundle

      - name: Package Steam distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path steam-build | Out-Null
          Copy-Item "src-tauri/target/release/*.exe" steam-build/
          Compress-Archive -Path steam-build/* -DestinationPath seven-spells-steam-windows.zip

      - name: Upload Steam distribution
        uses: actions/upload-artifact@v4
        with:
          name: seven-spells-steam-windows
          path: seven-spells-steam-windows.zip
          if-no-files-found: error
