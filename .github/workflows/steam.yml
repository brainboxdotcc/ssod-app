name: Steam and itch.io distribution

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Windows builds"]
    types: [completed]
    branches: [steam]

permissions:
  actions: read
  contents: read

concurrency:
  group: steam-distribution
  cancel-in-progress: false

jobs:
  steam:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Find Windows build
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
              $runId = "${{ github.event.workflow_run.id }}"
          } else {
              $runs = gh api `
                "repos/${{ github.repository }}/actions/workflows/tauri.yml/runs?branch=steam&status=success&per_page=1"

              $runId = ($runs | ConvertFrom-Json).workflow_runs[0].id
          }

          $run = gh api "repos/${{ github.repository }}/actions/runs/$runId" | ConvertFrom-Json

          "run_id=$runId" >> $env:GITHUB_OUTPUT
          "sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT
          "run_number=$($run.run_number)" >> $env:GITHUB_OUTPUT

          Write-Host "Using Windows build run $runId"

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: seven-spells-steam-windows
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: steam-build

      - name: Verify distribution
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem steam-build -Filter *.exe -File)
          if ($exe.Count -ne 1) {
              throw "Expected exactly one Windows executable."
          }
          if (!(Test-Path steam-build/steam_api64.dll)) {
              throw "steam_api64.dll is missing."
          }
          Get-ChildItem steam-build

      - name: Bundle WebView2 prerequisite
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "steam-build/MicrosoftEdgeWebview2Setup.exe"

          @'
          "InstallScript"
          {
              "Run Process"
              {
                  "WebView2 Runtime"
                  {
                      "Process 1" "%INSTALLDIR%\\MicrosoftEdgeWebview2Setup.exe"
                      "Command 1" "/silent /install"
                      "NoCleanUp" "1"
                  }
              }
          }
          '@ | Set-Content "steam-build/installscript.vdf" -Encoding ascii

      - name: Download SteamCMD
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force steamcmd | Out-Null
          Invoke-WebRequest `
            "https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip" `
            -OutFile "$env:RUNNER_TEMP/steamcmd.zip"
          Expand-Archive "$env:RUNNER_TEMP/steamcmd.zip" steamcmd

      - name: Restore Steam authentication
        shell: pwsh
        env:
          STEAM_CONFIG: ${{ secrets.STEAM_CONFIG_VDF_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STEAM_CONFIG)) {
              throw "STEAM_CONFIG_VDF_BASE64 secret is missing."
          }

          New-Item -ItemType Directory -Force steamcmd/config | Out-Null
          $bytes = [Convert]::FromBase64String($env:STEAM_CONFIG)
          [IO.File]::WriteAllBytes(
              "$PWD/steamcmd/config/config.vdf",
              $bytes
          )

      - name: Generate SteamPipe configuration
        shell: pwsh
        env:
          DEPOT_ID: ${{ vars.STEAM_DEPOT_ID }}
        run: |
          if ($env:DEPOT_ID -notmatch '^\d+$') {
              throw "Set STEAM_DEPOT_ID to the Windows depot ID."
          }

          New-Item -ItemType Directory -Force steampipe/output | Out-Null

          $content = (Resolve-Path steam-build).Path.Replace('\', '/')
          $output = (Resolve-Path steampipe/output).Path.Replace('\', '/')

          $vdf = @"
          "AppBuild"
          {
              "AppID" "1146240"
              "Desc" "GitHub Actions - ${{ steps.build.outputs.sha }}"
              "ContentRoot" "$content"
              "BuildOutput" "$output"

              "Depots"
              {
                  "$env:DEPOT_ID"
                  {
                      "FileMapping"
                      {
                          "LocalPath" "*"
                          "DepotPath" "."
                          "recursive" "1"
                      }
                      "InstallScript" "installscript.vdf"
                  }
              }
          }
          "@

          $vdf | Set-Content steampipe/app_build.vdf -Encoding ascii

      - name: Upload to SteamPipe
        shell: bash
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          script="$(cygpath -w "$(pwd)/steampipe/app_build.vdf")"

          ./steamcmd/steamcmd.exe \
            +login "$STEAM_USERNAME" \
            +run_app_build "$script" \
            +quit || true

          echo "SteamCMD invocation finished."

      - name: Publish Steam build
        shell: pwsh
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STEAM_WEB_API_KEY)) {
              throw "STEAM_WEB_API_KEY secret is missing."
          }

          $log = Get-Content steampipe/output/app_build_1146240.log -Raw
          $match = [regex]::Match(
              $log,
              'Successfully finished AppID 1146240 build \(BuildID (\d+)\)'
          )

          if (!$match.Success) {
              throw "Could not determine SteamPipe BuildID."
          }

          $buildId = $match.Groups[1].Value
          Write-Host "Publishing Steam build $buildId"

          $body = @{
              key = $env:STEAM_WEB_API_KEY
              appid = "1146240"
              buildid = $buildId
              betakey = "public"
          }

          $response = Invoke-WebRequest `
              -Uri "https://partner.steam-api.com/ISteamApps/SetAppBuildLive/v2/" `
              -Method Post `
              -Body $body

          if ($response.StatusCode -eq 201) {
              Write-Host "Steam build $buildId is awaiting Steam Mobile confirmation."
          } else {
              Write-Host "Steam accepted publication request for build $buildId (HTTP $($response.StatusCode))."
          }

  itch:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Find Windows build
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
              $runId = "${{ github.event.workflow_run.id }}"
          } else {
              $runs = gh api `
                "repos/${{ github.repository }}/actions/workflows/tauri.yml/runs?branch=steam&status=success&per_page=1"

              $runId = ($runs | ConvertFrom-Json).workflow_runs[0].id
          }

          $run = gh api "repos/${{ github.repository }}/actions/runs/$runId" | ConvertFrom-Json

          "run_id=$runId" >> $env:GITHUB_OUTPUT
          "sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT
          "run_number=$($run.run_number)" >> $env:GITHUB_OUTPUT

          Write-Host "Using Windows build run $runId"

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: seven-spells-steam-windows
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: steam-build

      - name: Install Butler
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default" `
            -OutFile "$env:RUNNER_TEMP/butler.zip"

          Expand-Archive "$env:RUNNER_TEMP/butler.zip" butler
          & "$PWD/butler/butler.exe" version

      - name: Publish to itch.io
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUTLER_API_KEY)) {
              throw "BUTLER_API_KEY secret is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:ITCH_TARGET)) {
              throw "ITCH_TARGET repository variable is missing."
          }

          & "$PWD/butler/butler.exe" push `
            steam-build `
            "$env:ITCH_TARGET" `
            --userversion "${{ steps.build.outputs.run_number }}"

          if ($LASTEXITCODE -ne 0) {
              throw "Butler upload failed: $LASTEXITCODE"
          }